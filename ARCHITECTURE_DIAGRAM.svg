<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 735" font-family="'IBM Plex Sans', Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="735" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#1b1e2c">Reppit — Runtime Architecture</text>
  <text x="600" y="50" text-anchor="middle" font-size="12.5" fill="#636a82">The browser is the only application code that runs — there is no backend server</text>

  <g transform="translate(0,55)">
    <defs>
      <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L7,3 L0,6 Z" fill="#1b1e2c" />
      </marker>
      <marker id="arrowMuted" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L7,3 L0,6 Z" fill="#636a82" />
      </marker>
    </defs>

    <!-- Browser -->
    <rect x="410" y="30" width="380" height="92" rx="10" fill="#eef1fc" stroke="#3452d1" stroke-width="2" />
    <text x="600" y="60" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1e2c">Browser</text>
    <text x="600" y="82" text-anchor="middle" font-size="12.5" fill="#1b1e2c">reddit-dapp-project — React + Vite + TypeScript</text>
    <text x="600" y="100" text-anchor="middle" font-size="12.5" fill="#636a82">ethers.js + MetaMask · the only client</text>

    <!-- bus -->
    <line x1="600" y1="122" x2="600" y2="140" stroke="#636a82" stroke-width="1.5" />
    <line x1="220" y1="140" x2="980" y2="140" stroke="#636a82" stroke-width="1.5" />

    <!-- branches -->
    <line x1="220" y1="140" x2="220" y2="188" stroke="#1b1e2c" stroke-width="2" marker-end="url(#arrow)" />
    <text x="220" y="168" text-anchor="middle" font-size="11" fill="#636a82">sign &amp; send tx</text>

    <line x1="515" y1="140" x2="515" y2="188" stroke="#1b1e2c" stroke-width="2" marker-end="url(#arrow)" />
    <text x="515" y="168" text-anchor="middle" font-size="11" fill="#636a82">pin content</text>

    <line x1="685" y1="140" x2="685" y2="188" stroke="#1b1e2c" stroke-width="2" marker-end="url(#arrow)" />
    <text x="685" y="168" text-anchor="middle" font-size="11" fill="#636a82">fetch by CID</text>

    <line x1="980" y1="140" x2="980" y2="188" stroke="#1b1e2c" stroke-width="2" marker-end="url(#arrow)" />
    <text x="980" y="168" text-anchor="middle" font-size="11" fill="#636a82">GraphQL query</text>

    <!-- Sepolia group -->
    <rect x="40" y="195" width="360" height="365" rx="12" fill="#f5eefd" stroke="#7c3aed" stroke-width="2" />
    <text x="220" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e2c">Sepolia contracts</text>

    <!-- DecentralizedForum + ForumModeration: coupled, bidirectional on-chain calls -->
    <rect x="64" y="248" width="312" height="60" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3" />
    <text x="220" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1e2c">DecentralizedForum</text>
    <text x="220" y="290" text-anchor="middle" font-size="11" fill="#636a82">posts · votes · membership · governance</text>

    <text x="220" y="320" text-anchor="middle" font-size="8.5" font-family="'IBM Plex Mono',monospace" fill="#7c3aed">flagPostForReview()</text>
    <line x1="220" y1="324" x2="220" y2="356" stroke="#7c3aed" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <text x="220" y="368" text-anchor="middle" font-size="8.5" font-family="'IBM Plex Mono',monospace" fill="#7c3aed">awardPostApprovalActivity()</text>

    <rect x="64" y="372" width="312" height="70" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3" />
    <text x="220" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1e2c">ForumModeration</text>
    <text x="220" y="418" text-anchor="middle" font-size="11" fill="#636a82">moderation queue · comments · reports</text>

    <text x="220" y="458" text-anchor="middle" font-size="9.5" font-style="italic" fill="#636a82">↑ the two above call each other on-chain (guarded, one address each)</text>

    <!-- UsernameRegistry: dashed = no on-chain relationship to the pair above -->
    <rect x="64" y="470" width="312" height="80" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5,4" />
    <text x="220" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1e2c">UsernameRegistry</text>
    <text x="220" y="510" text-anchor="middle" font-size="11" fill="#636a82">registration · uniqueness · cooldown</text>
    <text x="220" y="527" text-anchor="middle" font-size="9.5" font-style="italic" fill="#636a82">no on-chain link to the contracts above —</text>
    <text x="220" y="540" text-anchor="middle" font-size="9.5" font-style="italic" fill="#636a82">independent; the browser calls it directly</text>

    <!-- IPFS group -->
    <rect x="420" y="195" width="360" height="280" rx="12" fill="#e9f8f2" stroke="#0f9d78" stroke-width="2" />
    <text x="600" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e2c">IPFS content storage</text>
    <text x="600" y="239" text-anchor="middle" font-size="11" fill="#636a82">services/ipfs.ts</text>

    <rect x="440" y="250" width="150" height="210" rx="7" fill="#ffffff" stroke="#0f9d78" stroke-width="1.3" />
    <text x="515" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1e2c">Write</text>
    <text x="515" y="297" text-anchor="middle" font-size="12" fill="#1b1e2c">Pinata</text>
    <text x="515" y="326" text-anchor="middle" font-size="10.5" fill="#636a82">shared pinning key</text>
    <text x="515" y="342" text-anchor="middle" font-size="10.5" fill="#636a82">(VITE_PINATA_JWT)</text>
    <text x="515" y="358" text-anchor="middle" font-size="10.5" fill="#636a82">in the JS bundle</text>

    <rect x="610" y="250" width="150" height="210" rx="7" fill="#ffffff" stroke="#0f9d78" stroke-width="1.3" />
    <text x="685" y="277" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1e2c">Read</text>
    <text x="685" y="297" text-anchor="middle" font-size="12" fill="#1b1e2c">public gateways</text>
    <text x="685" y="322" text-anchor="middle" font-size="10.5" fill="#636a82">pinata.cloud</text>
    <text x="685" y="338" text-anchor="middle" font-size="10.5" fill="#636a82">ipfs.io</text>
    <text x="685" y="354" text-anchor="middle" font-size="10.5" fill="#636a82">dweb.link</text>
    <text x="685" y="376" text-anchor="middle" font-size="10.5" font-style="italic" fill="#636a82">first to answer</text>
    <text x="685" y="392" text-anchor="middle" font-size="10.5" font-style="italic" fill="#636a82">wins</text>

    <!-- Graph group -->
    <rect x="800" y="195" width="360" height="280" rx="12" fill="#fbf1de" stroke="#b8730f" stroke-width="2" />
    <text x="980" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1e2c">Graph indexer</text>
    <text x="980" y="239" text-anchor="middle" font-size="11" fill="#636a82">services/graph.ts · Docker</text>

    <text x="980" y="272" text-anchor="middle" font-size="12.5" fill="#1b1e2c">graph-node + Postgres + kubo</text>
    <text x="980" y="296" text-anchor="middle" font-size="11" fill="#636a82">indexes contract events for</text>
    <text x="980" y="313" text-anchor="middle" font-size="11" fill="#636a82">search, trending, notifications,</text>
    <text x="980" y="330" text-anchor="middle" font-size="11" fill="#636a82">profile stats</text>

    <line x1="870" y1="378" x2="1090" y2="378" stroke="#dadde6" stroke-width="1" />
    <text x="980" y="400" text-anchor="middle" font-size="10.5" font-style="italic" fill="#b8730f">if unreachable, the browser reads</text>
    <text x="980" y="416" text-anchor="middle" font-size="10.5" font-style="italic" fill="#b8730f">Sepolia directly instead</text>

    <!-- emits events (dashed) -->
    <path d="M 400,560 V 585 H 800 V 480" fill="none" stroke="#636a82" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowMuted)" />
    <text x="600" y="578" text-anchor="middle" font-size="11" fill="#636a82">emits events</text>

    <!-- legend -->
    <line x1="300" y1="618" x2="345" y2="618" stroke="#1b1e2c" stroke-width="2" marker-end="url(#arrow)" />
    <text x="354" y="622" font-size="11.5" fill="#636a82">direct call — tx, pin, fetch, query</text>

    <line x1="700" y1="618" x2="745" y2="618" stroke="#636a82" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#arrowMuted)" />
    <text x="754" y="622" font-size="11.5" fill="#636a82">emitted event / degrades to fallback</text>
  </g>

  <!-- Footer -->
  <text x="600" y="720" text-anchor="middle" font-size="12" fill="#888">See DEVELOPER_GUIDE.md for the module-by-module walkthrough</text>
</svg>
