type User @entity(immutable: false) {
  id: ID! # lowercase address
  username: String
  registeredAt: BigInt
  postCount: Int!
  communitiesJoined: Int!
  totalGasUsed: BigInt!
  totalFeesWei: BigInt!
  posts: [Post!]! @derivedFrom(field: "author")
  activities: [Activity!]! @derivedFrom(field: "user")
  notifications: [Notification!]! @derivedFrom(field: "recipient")
}

type Community @entity(immutable: false) {
  id: ID! # communityId
  name: String!
  description: String!
  creator: User!
  parent: Community
  membersCount: BigInt!
  # Count of publicly visible posts (not hidden/pending/rejected), maintained by
  # the post handlers. Lets the frontend compute an exact page count for its
  # first/skip pagination without ever loading the whole feed.
  visiblePostsCount: BigInt!
  createdAt: BigInt!
  # Full moderator set (creator + appointed + the two active moderators),
  # maintained so review notifications can fan out to everyone.
  moderators: [String!]!
  activeModerator1: String
  activeModerator2: String
  posts: [Post!]! @derivedFrom(field: "community")
}

type Post @entity(immutable: false) {
  id: ID! # postId
  community: Community!
  author: User!
  contentCID: String!
  title: String!
  tags: [String!]!
  tagsText: String! # comma-joined copy used by fulltext search
  score: BigInt!
  upvotes: BigInt!
  downvotes: BigInt!
  hidden: Boolean!
  locked: Boolean! # locked posts stay visible but accept no new comments
  pending: Boolean!
  rejected: Boolean!
  createdAt: BigInt!
}

type Comment @entity(immutable: false) {
  id: ID! # on-chain comment id
  post: Post!
  community: Community!
  author: User!
  content: String!
  imageCid: String!
  hidden: Boolean!
  createdAt: BigInt!
}

type PendingComment @entity(immutable: false) {
  id: ID! # on-chain comment id (shared global space with Comment)
  post: Post!
  community: Community!
  author: User!
  content: String!
  imageCid: String!
  status: Int! # 0 pending, 1 approved, 2 rejected
  hidden: Boolean! # an approved comment can later be hidden by a moderator
  createdAt: BigInt!
}

type Vote @entity(immutable: false) {
  id: ID! # postId-voterAddress
  post: Post!
  voter: User!
  value: Int!
  updatedAt: BigInt!
}

# Marks a (transaction, account) pair whose gas has already been added to the
# account's running totals. One transaction emits several events (e.g. a single
# createCommunity fires CommunityCreated + CommunityJoined + ModeratorAdded), and
# recordActivity runs per event - without this guard the same gas would be
# counted several times. Existence is all that matters.
type AccountedTransaction @entity(immutable: true) {
  id: ID! # transactionHash + "-" + userAddress
}

type Report @entity(immutable: true) {
  id: ID! # txHash-logIndex
  kind: Int! # 0 = post, 1 = comment
  refId: BigInt! # postId or commentId
  community: Community!
  reporter: User!
  reason: String!
  createdAt: BigInt!
}

# One row per reported piece of content, so many reports collapse into a single
# actionable item with a lifecycle (open -> resolved/dismissed). This is what the
# moderator queue reads, so handled content leaves the list and duplicates fold in.
type ReportThread @entity(immutable: false) {
  id: ID! # communityId-kind-refId
  community: Community!
  kind: Int! # 0 = post, 1 = comment
  refId: BigInt!
  status: Int! # 0 open, 1 action taken, 2 dismissed
  reportCount: Int!
  lastReason: String!
  firstReportedAt: BigInt!
  lastReportedAt: BigInt!
  resolvedBy: User
  resolvedAt: BigInt
}

type BannedUser @entity(immutable: false) {
  id: ID! # communityId-userAddress
  community: Community!
  user: User!
  reason: String!
  bannedBy: User!
  bannedAt: BigInt!
}

enum ActivityType {
  COMMUNITY_CREATED
  SUBCOMMUNITY_CREATED
  COMMUNITY_JOINED
  COMMUNITY_LEFT
  POST_CREATED
  POST_VOTED
  POST_HIDDEN
  POST_RESTORED
  BECAME_MODERATOR
  MODERATOR_REMOVED
  MODERATOR_RESIGNED
  MODERATOR_RECOMMENDED
  USERNAME_REGISTERED
  USERNAME_CHANGED
  USER_BANNED
  USER_UNBANNED
  POST_REVIEWED
  COMMENT_REVIEWED
  COMMENT_SUBMITTED
  COMMENT_CREATED
  POST_LOCKED
  POST_UNLOCKED
  COMMENT_HIDDEN
  APPOINTED_ROLE_REMOVED
}

type Activity @entity(immutable: true) {
  id: ID! # txHash-logIndex
  user: User!
  type: ActivityType!
  refId: BigInt
  detail: String
  gasUsed: BigInt!
  feeWei: BigInt!
  timestamp: BigInt!
}

enum NotificationType {
  BECAME_MODERATOR
  MODERATOR_REMOVED
  MODERATOR_OFFER
  REMOVAL_VOTE_PENDING
  POST_UPVOTED
  POST_DOWNVOTED
  POST_HIDDEN
  BANNED
  UNBANNED
  POST_PENDING_REVIEW
  COMMENT_PENDING_REVIEW
  POST_APPROVED
  POST_REJECTED
  COMMENT_APPROVED
  COMMENT_REJECTED
  COMMENT_REPLY
  POST_LOCKED
  COMMENT_HIDDEN
  CONTENT_REPORTED
}

type Notification @entity(immutable: true) {
  id: ID! # txHash-logIndex
  recipient: User!
  type: NotificationType!
  actor: User
  refId: BigInt
  detail: String
  timestamp: BigInt!
}

type _Schema_
  @fulltext(
    name: "postSearch"
    language: en
    algorithm: rank
    include: [{ entity: "Post", fields: [{ name: "title" }, { name: "tagsText" }] }]
  )
  @fulltext(
    name: "communitySearch"
    language: en
    algorithm: rank
    include: [{ entity: "Community", fields: [{ name: "name" }, { name: "description" }] }]
  )
  @fulltext(
    name: "userSearch"
    language: en
    algorithm: rank
    include: [{ entity: "User", fields: [{ name: "username" }] }]
  )
