# Graph stack indexing PUBLIC SEPOLIA. Runs SIDE BY SIDE with the local stack:
# its own compose project name, its own ports (8100/8120/5101/5442) and its own
# Postgres volume, so `redeploy.bat` / `docker compose down -v` for local dev can
# never stop or wipe it. All services auto-restart with Docker Desktop.
# Start via redeploy-sepolia.bat.
name: reppit-graph-sepolia

services:
  graph-node:
    image: graphprotocol/graph-node:latest
    restart: unless-stopped
    ports:
      - '8100:8000' # GraphQL HTTP queries
      - '8101:8001' # GraphQL WebSocket
      - '8120:8020' # Admin JSON-RPC (graph deploy)
      - '8130:8030' # Index node status
      - '8140:8040' # Metrics
    depends_on:
      - ipfs
      - postgres
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: 'ipfs:5001'
      # Free public Sepolia RPC. It must allow historical eth_getLogs over wide
      # block ranges. Tenderly's public gateway does; dRPC dropped Sepolia from
      # its free plan ("chain is not available on free plan") and publicnode's
      # free tier rejects archive requests. Override with a personal
      # Alchemy/Infura URL if this one rate-limits you:
      #   Windows:     set SEPOLIA_RPC_URL=https://...   then redeploy-sepolia.bat
      #   macOS/Linux: export SEPOLIA_RPC_URL=https://... then ./redeploy-sepolia.sh
      ethereum: 'sepolia:${SEPOLIA_RPC_URL:-https://sepolia.gateway.tenderly.co}'
      GRAPH_LOG: info
      # Required for the @fulltext search directives in schema.graphql.
      GRAPH_ALLOW_NON_DETERMINISTIC_FULLTEXT_SEARCH: 'true'
  ipfs:
    image: ipfs/kubo:v0.34.1
    restart: unless-stopped
    ports:
      - '5101:5001'
  postgres:
    image: postgres:16
    restart: unless-stopped
    ports:
      - '5442:5432'
    command: ['postgres', '-cshared_preload_libraries=pg_stat_statements', '-cmax_connections=200']
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      # graph-node requires a C locale database
      POSTGRES_INITDB_ARGS: '-E UTF8 --locale=C'
    volumes:
      - postgres-data-sepolia:/var/lib/postgresql/data

volumes:
  postgres-data-sepolia:
